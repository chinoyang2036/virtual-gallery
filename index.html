<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contour Gallery｜展廳總覽</title><style>
*{box-sizing:border-box}body{margin:0;color:#242728;background:#fafaf8;font:16px/1.6 Arial,"Microsoft JhengHei",sans-serif}button,input,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}header{background:#fff;padding:22px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd;gap:12px}.brand{font-size:22px;font-weight:800;letter-spacing:2px}nav{display:flex;gap:10px}button,.link{padding:10px 17px;border:1px solid #bbc0be;background:#fff;border-radius:5px;color:#242728}.primary{background:#242728;color:#fff;border-color:#242728}.hero{padding:65px 6% 48px;text-align:center;background:#eeeee8}.hero h1{font-size:clamp(30px,5vw,54px);font-weight:400;margin:0 0 12px}.hero p{color:#67706b;margin:0}.toolbar{max-width:1200px;margin:26px auto 0;padding:0 24px;display:flex;flex-wrap:wrap;gap:10px}.drop{max-width:1152px;margin:20px auto;padding:24px;border:2px dashed #b0b9b3;text-align:center;background:#f0f3ee;border-radius:9px}.drop.over{background:#dbe8da;border-color:#45624e}.hint,#status{color:#627067;font-size:14px}#status{max-width:1152px;margin:12px auto;padding:0 15px}.heading{max-width:1200px;margin:40px auto 20px;padding:0 24px;display:flex;justify-content:space-between;align-items:center}.grid{max-width:1200px;margin:auto;padding:0 24px 50px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.card{background:#fff;border:1px solid #deded7;border-radius:9px;overflow:hidden;box-shadow:0 3px 12px #00000006}.thumb{height:auto;aspect-ratio:16/9;width:100%;object-fit:cover;display:block;background:#e3e5dd}.placeholder{aspect-ratio:16/9;display:grid;place-items:center;background:linear-gradient(145deg,#dbe1d7,#b2bdb6);color:#59695e;font-size:23px;letter-spacing:3px}.info{padding:19px}.info h3{margin:0 0 8px;font-size:21px}.info p{margin:0 0 17px;color:#778178;min-height:26px;white-space:pre-wrap}.controls{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.controls button{font-size:13px;padding:5px 10px}.add{min-height:300px;border:2px dashed #b5bcb3;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px}.add span{font-size:55px}.empty{text-align:center;color:#788377;grid-column:1/-1;padding:45px}.stage{position:fixed;inset:0;background:#111;z-index:30;display:flex;flex-direction:column}.stage[hidden]{display:none}.stagebar{background:white;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px}iframe{flex:1;width:100%;border:0}dialog{border:1px solid #b7c0b6;border-radius:12px;width:min(530px,94vw);max-height:90vh;overflow:auto;padding:25px;background:#fff}dialog::backdrop{background:#0008}label{display:block;margin:14px 0 5px}input[type=text],textarea{width:100%;border:1px solid #c8cec5;border-radius:5px;padding:9px}textarea{height:100px}.dialog-actions{display:flex;gap:10px;margin-top:20px}footer{padding:25px;text-align:center;color:#8c9288;border-top:1px solid #ddd}.published .admin{display:none!important}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:580px){header{padding:16px;flex-wrap:wrap}.brand{font-size:18px}.grid{grid-template-columns:1fr}.hero{padding:40px 20px}.drop{margin:15px}.toolbar{padding:0 15px}nav button{padding:8px 10px}}
</style></head><body class="published"><header><div class="brand">◇ CONTOUR GALLERY</div><nav><button id="nav-about">關於</button><button id="nav-all">3D EXHIBITIONS</button><button id="mode" class="admin">觀眾預覽</button></nav></header><section class="hero"><h1>在空間裡，遇見藝術。</h1><p>選一座展廳，開始你的觀展旅程。</p></section><div class="toolbar admin"><button id="import" class="primary">＋ 新增展廳／封面</button><button id="export" disabled="">匯出網站 ZIP</button><button id="backup">備份管理檔</button><input id="domain" type="text" value="virtualgallery.store" aria-label="網站網域" placeholder="網站網域（可留空）" style="width:210px"><input id="files" type="file" accept=".html,.htm,image/*" multiple="" hidden=""></div><div id="drop" class="drop admin">拖入展廳 HTML 與封面圖片<br><span class="hint">相同檔名自動配對，例如 industrial.html ＋ industrial.jpg；也可點按鈕選取。</span></div><p id="status" role="status" class="admin"></p><div class="heading" id="exhibitions"><h2>3D 展廳</h2><span id="count">5 座展廳</span></div><main id="grid" class="grid"></main><section id="about" style="max-width:1152px;margin:0 auto 40px;padding:20px;color:#667365"><h2>關於展覽</h2><p>透過不同空間探索藝術。點選展廳封面或「進入 3D」，開啟對應展覽。</p></section><footer>CONTOUR GALLERY · VIRTUAL GALLERY</footer><div class="stage" id="stage" hidden=""><div class="stagebar"><strong id="stage-title"></strong><button id="close-stage">← 返回展廳總覽</button></div><iframe id="frame" title="3D 展廳" sandbox="allow-scripts allow-pointer-lock allow-downloads allow-forms allow-popups" allow="fullscreen" allowfullscreen=""></iframe></div><dialog id="edit"><h2>編輯展廳</h2><label for="title">展廳名稱</label><input id="title" type="text"><label for="desc">簡介</label><textarea id="desc"></textarea><label for="cover">更換封面</label><input id="cover" type="file" accept="image/*"><label for="replace">替換展廳 HTML</label><input id="replace" type="file" accept=".html,.htm"><div class="dialog-actions"><button id="save" class="primary">儲存</button><button id="cancel">取消</button></div></dialog><script id="portal-state" type="application/json">{"published":true,"items":[{"id":"a8bf8a05-025c-4790-9500-c24d01bac98b","title":"La Galerie","desc":"","path":"galleries/01-1005.html","cover":"covers/01-1005.jpg"},{"id":"628777fb-73e5-4872-a5db-0953b0a1a35a","title":"Contour Gallery","desc":"","path":"galleries/02-industrial-fly.html","cover":"covers/02-industrial-fly.jpg"},{"id":"60b30dfc-8a7e-429b-90bf-84885f9194a4","title":"La Rotonde","desc":"","path":"galleries/03-industrial-hoop-fly.html","cover":"covers/03-industrial-hoop-fly.jpg"},{"id":"360eac2b-d4bb-46f5-a267-bb4a04d30421","title":"La Rotonde","desc":"","path":"galleries/04-la-rotonde-1005.html","cover":"covers/04-la-rotonde-1005.jpg"},{"id":"887ad9f7-23a5-4b05-a1a2-448374152451","title":"La Rotonde","desc":"","path":"galleries/05-cruise-gallery-fly-1005.html","cover":"covers/05-cruise-gallery-fly-1005.jpg"}]}</script><script>
'use strict';
const $=id=>document.getElementById(id),initial=JSON.parse($('portal-state').textContent);let items=initial.items||[],published=!!initial.published,managing=!published,editId=null,dragId=null;const pending=new Map();
if(published)document.body.classList.add('published');
function message(t){$('status').textContent=t;}
function base(n){return n.replace(/\.[^.]+$/,'').normalize('NFKC').toLowerCase().trim();}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);}
function dataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});}
function db(){return new Promise((res,rej)=>{const r=indexedDB.open('contour-portal-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('state');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function persist(){if(published)return;try{const d=await db();await new Promise((res,rej)=>{const tx=d.transaction('state','readwrite');tx.objectStore('state').put(items,'items');tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});d.close();message('已儲存在這台裝置。分享前請匯出網站 ZIP；建議另存備份管理檔。');}catch(e){message('瀏覽器無法保存資料，請按「備份管理檔」下載保存。');}}
function coverFrom(html){const doc=new DOMParser().parseFromString(html,'text/html');for(const sel of ['meta[name="gallery-cover"]','meta[property="og:image"]','#entry-cover','#cover img']){const el=doc.querySelector(sel);const v=el&&(el.content||el.getAttribute('src'));if(v&&/^data:image\//i.test(v))return v;}
const m=html.match(/(?:window\.)?(?:GALLERY_COVER|ROTONDE_COVER)\s*=\s*("(?:[^"\\]|\\.)*")/);if(m){try{const v=JSON.parse(m[1]);if(/^data:image\//i.test(v))return v;}catch(e){}}
return '';}
async function importFiles(files){if(published)return;message('匯入中…');try{const all=Array.from(files),htmls=all.filter(f=>/\.html?$/i.test(f.name)),pics=all.filter(f=>/^image\//.test(f.type));for(const f of pics)pending.set(base(f.name),await dataURL(f));for(const f of htmls){const html=await f.text(),key=base(f.name);let item=items.find(a=>a.key===key);if(!item){const doc=new DOMParser().parseFromString(html,'text/html');item={id:uid(),key,fileName:f.name,title:(doc.querySelector('h1')?.textContent||doc.title||f.name).trim(),desc:'',html,cover:''};items.push(item);}item.html=html;item.cover=pending.get(key)||coverFrom(html)||item.cover||'';pending.delete(key);}
for(const [key,cover] of pending){const item=items.find(a=>a.key===key);if(item){item.cover=cover;pending.delete(key);}}
render();await persist();if(pending.size)message('已匯入。另有 '+pending.size+' 張圖片尚未配對：請匯入相同檔名的 HTML，或按卡片「編輯」手動選封面。');}catch(e){message('匯入失敗：'+e.message);}}
function move(id,delta){const i=items.findIndex(a=>a.id===id),j=i+delta;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];render();persist();}
function open(item){$('stage-title').textContent=item.title;$('stage').hidden=false;document.body.style.overflow='hidden';if(published)$('frame').src=item.path;else $('frame').srcdoc=item.html;}
function closeStage(){$('stage').hidden=true;$('frame').removeAttribute('srcdoc');$('frame').src='about:blank';document.body.style.overflow='';}
function button(label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;return b;}
function render(){const g=$('grid');g.replaceChildren();$('count').textContent=items.length+' 座展廳';for(const item of items){const c=document.createElement('article');c.className='card';c.draggable=managing;c.addEventListener('dragstart',e=>{if(e.target.closest('button')){e.preventDefault();return;}dragId=item.id;e.dataTransfer.setData('text/plain',item.id);});c.addEventListener('dragover',e=>{if(dragId)e.preventDefault();});c.addEventListener('drop',e=>{if(!dragId)return;e.preventDefault();e.stopPropagation();const i=items.findIndex(a=>a.id===dragId);const j=items.findIndex(a=>a.id===item.id);if(i<0||j<0)return;const a=items.splice(i,1)[0];items.splice(j,0,a);dragId=null;render();persist();});c.addEventListener('dragend',()=>dragId=null);
const cover=button('',()=>open(item));cover.style.cssText='padding:0;border:0;width:100%;display:block;border-radius:0';cover.setAttribute('aria-label','進入 '+item.title);if(item.cover){const img=document.createElement('img');img.src=item.cover;img.alt=item.title;img.className='thumb';img.loading='lazy';cover.append(img);}else{const p=document.createElement('div');p.className='placeholder';p.textContent='VIRTUAL GALLERY';cover.append(p);}c.append(cover);const info=document.createElement('div');info.className='info';const h=document.createElement('h3');h.textContent=item.title;const p=document.createElement('p');p.textContent=item.desc;const b=button('進入 3D →',()=>open(item));b.className='primary';info.append(h,p,b);if(managing){const controls=document.createElement('div');controls.className='controls';controls.append(button('編輯',()=>edit(item)),button('← 上移',()=>move(item.id,-1)),button('下移 →',()=>move(item.id,1)),button('移除',()=>{if(confirm('從清單移除「'+item.title+'」？原始檔不會被刪除。')){items=items.filter(a=>a.id!==item.id);render();persist();}}));info.append(controls);}c.append(info);g.append(c);}
if(managing){const a=button('',()=>$('files').click());a.className='add';const plus=document.createElement('span');plus.textContent='＋';a.append(plus,document.createTextNode('新增展廳'));g.append(a);}else if(!items.length){const p=document.createElement('p');p.className='empty';p.textContent='目前尚無展廳。';g.append(p);}document.querySelectorAll('.toolbar,.drop').forEach(e=>e.hidden=!managing);$('mode').textContent=managing?'觀眾預覽':'管理模式';}
function edit(item){editId=item.id;$('title').value=item.title;$('desc').value=item.desc;$('cover').value='';$('replace').value='';$('edit').showModal();}
$('save').onclick=async()=>{const item=items.find(a=>a.id===editId);if(!item)return;try{item.title=$('title').value.trim()||'未命名展廳';item.desc=$('desc').value.trim();if($('cover').files[0])item.cover=await dataURL($('cover').files[0]);if($('replace').files[0])item.html=await $('replace').files[0].text();$('edit').close();render();await persist();}catch(e){message('儲存失敗：'+e.message);}};$('cancel').onclick=()=>$('edit').close();
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);}
function serialize(state){const clone=document.documentElement.cloneNode(true);clone.querySelector('#portal-state').textContent=JSON.stringify(state).replace(/</g,'\\u003c');clone.querySelector('#grid').replaceChildren();clone.querySelector('#status').textContent='';clone.querySelector('#stage').hidden=true;clone.querySelector('#frame').removeAttribute('srcdoc');clone.querySelector('#frame').removeAttribute('src');clone.querySelector('#edit').removeAttribute('open');clone.querySelector('body').style.overflow='';clone.querySelector('body').classList.toggle('published',state.published);return '<!doctype html>\n'+clone.outerHTML;}
$('backup').onclick=()=>download(new Blob([serialize({published:false,items})],{type:'text/html;charset=utf-8'}),'Contour-Gallery_管理備份.html');
function crc32(bytes){let crc=0xffffffff;for(const byte of bytes){crc^=byte;for(let j=0;j<8;j++)crc=(crc>>>1)^((crc&1)?0xedb88320:0);}return (crc^0xffffffff)>>>0;}
function zip(entries){const enc=new TextEncoder(),chunks=[],central=[];let offset=0;for(const {name,data} of entries){const n=enc.encode(name),d=typeof data==='string'?enc.encode(data):data,crc=crc32(d),h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,n.length,true);chunks.push(h.buffer,n,d);const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x800,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,n.length,true);c.setUint32(42,offset,true);central.push(c.buffer,n);offset+=30+n.length+d.length;}const size=central.reduce((n,b)=>n+b.byteLength,0),end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);end.setUint32(12,size,true);end.setUint32(16,offset,true);return new Blob([...chunks,...central,end.buffer],{type:'application/zip'});}
function decodeImage(data){const m=data.match(/^data:image\/(png|jpeg|webp|gif);base64,(.*)$/s);if(!m)return null;return {ext:m[1]==='jpeg'?'jpg':m[1],bytes:Uint8Array.from(atob(m[2]),c=>c.charCodeAt(0))};}
$('export').onclick=async()=>{if(!items.length){message('請先新增至少一座展廳。');return;}const b=$('export');b.disabled=true;message('正在打包網站…');try{await new Promise(r=>setTimeout(r,30));const entries=[],manifest=items.map((item,i)=>{const slug=String(i+1).padStart(2,'0')+'-'+(item.key.replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,45)||'gallery'),path='galleries/'+slug+'.html';entries.push({name:path,data:item.html});let cover='';if(item.cover){const image=decodeImage(item.cover);if(image){cover='covers/'+slug+'.'+image.ext;entries.push({name:cover,data:image.bytes});}}return {id:item.id,title:item.title,desc:item.desc,path,cover};});entries.unshift({name:'index.html',data:serialize({published:true,items:manifest})});entries.push({name:'.nojekyll',data:''});const domain=$('domain').value.trim();if(domain){if(!/^(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$/i.test(domain))throw Error('網域請只填名稱，例如 virtualgallery.store，不含 https://');entries.push({name:'CNAME',data:domain+'\n'});}entries.push({name:'上傳說明.txt',data:'解壓縮後，將 index.html、galleries、covers、.nojekyll 上傳到 GitHub main 根目錄。若已有 CNAME 請保留原設定；確認新檔內容與既有網域一致再替換。管理修改後需重新匯出並上傳。預覽請使用瀏覽器開啟 index.html。展廳 HTML 如引用外部或相對路徑資源，需另行提供對應資源。'});download(zip(entries),'Contour-Gallery_網站.zip');message('網站 ZIP 已輸出。解壓縮後上傳內容，不要只上傳 ZIP。');}catch(e){message('匯出失敗：'+e.message);}finally{b.disabled=false;}};
$('import').onclick=()=>$('files').click();$('files').onchange=e=>{importFiles(e.target.files);e.target.value='';};$('mode').onclick=()=>{managing=!managing;render();};$('nav-all').onclick=()=>$('exhibitions').scrollIntoView({behavior:'smooth'});$('nav-about').onclick=()=>$('about').scrollIntoView({behavior:'smooth'});$('close-stage').onclick=closeStage;
for(const event of ['dragover','drop'])document.addEventListener(event,e=>{if(published)return;if(e.dataTransfer?.types.includes('Files')){e.preventDefault();if(event==='drop'){ $('drop').classList.remove('over');importFiles(e.dataTransfer.files);}}});$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('over');};$('drop').ondragleave=()=>$('drop').classList.remove('over');
async function init(){if(!published&&!items.length){try{const d=await db();const saved=await new Promise((res,rej)=>{const r=d.transaction('state').objectStore('state').get('items');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});d.close();if(saved)items=saved;}catch(e){message('本機記憶不可用，請使用備份管理檔保存。');}}render();}init();
</script>
</body></html>
